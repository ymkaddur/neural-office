name: Windows pilot tests
on:
  push:
    branches: [main, v5.2, v5.2.1, v5.3, feat/v5.10-windows-review, feat/v5.11-director]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, resolved 2026-11-16
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0, resolved 2026-11-16
        with:
          python-version: '3.12'
      - name: Test without models, credentials or private state
        run: python -B -m unittest discover -s tests -v
      - name: Verify the published V5.7 comparison without a model
        run: python -B tools/verify_v57.py
      - name: Reproduce corrected forensic boundaries with synthetic state
        run: python -B tests/repro_v541_boundaries.py --repo . --expect fixed
  desktop-preview:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, resolved 2026-11-16
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
  desktop-native:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Build the local desktop renderer
        working-directory: desktop
        run: |
          npm ci --ignore-scripts
          npm run build -- --mode native
      - name: Test the native command boundary
        working-directory: desktop/src-tauri
        run: cargo test --locked --features custom-protocol
      - name: Compile the Windows test host
        working-directory: desktop/src-tauri
        run: cargo build --locked --release --features custom-protocol
      - name: Prepare isolated native UI test tools
        shell: pwsh
        run: ./tests/Prepare-V55NativeCI.ps1 -UIAutomationOnly
      - name: Exercise packaged UI, native picker, real model and restart
        timeout-minutes: 15
        run: python -B tests/e2e_v55_native_uia.py --output native-e2e-evidence
      - name: Check out the exact V5.10 source for the comparison
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 829dc7beeae394e6b960e2f6c90975afbb184585
          path: baseline-v510
          persist-credentials: false
      - name: Build the reference renderer and native host
        working-directory: baseline-v510/desktop
        run: |
          npm ci --ignore-scripts
          npm run build -- --mode native
          Copy-Item -LiteralPath "$env:GITHUB_WORKSPACE/desktop/src-tauri/target/release/neural-office-desktop.exe" -Destination "$env:RUNNER_TEMP/candidate-v511.exe"
          $env:CARGO_TARGET_DIR = "$env:GITHUB_WORKSPACE/desktop/src-tauri/target"
          cargo build --manifest-path src-tauri/Cargo.toml --locked --release --features custom-protocol
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item -LiteralPath "$env:CARGO_TARGET_DIR/release/neural-office-desktop.exe" -Destination "$env:RUNNER_TEMP/reference-v510.exe"
          Copy-Item -LiteralPath "$env:RUNNER_TEMP/candidate-v511.exe" -Destination "$env:CARGO_TARGET_DIR/release/neural-office-desktop.exe" -Force
      - name: Verify targeted controls and compare CPU, memory and typography in packaged windows
        run: python -B -m tools.verify_v510_desktop --exe "$env:RUNNER_TEMP/candidate-v511.exe" --baseline-exe "$env:RUNNER_TEMP/reference-v510.exe" --baseline-core baseline-v510 --output v511-comparison
      - name: Upload synthetic native UI evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: neural-office-v511-native-ui-evidence
          path: |
            native-e2e-evidence/
            v511-comparison/
          if-no-files-found: warn
          retention-days: 14
      - name: Hash the test executable
        shell: pwsh
        run: |
          $binary = 'desktop/src-tauri/target/release/neural-office-desktop.exe'
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $binary).Hash.ToLowerInvariant()
          "$hash  neural-office-desktop.exe" | Set-Content -Encoding ascii 'desktop/src-tauri/target/release/SHA256SUMS'
      - name: Collect notices for the compiled dependency set
        run: python -B tools/collect_native_notices.py --output native-notices
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 resolved 2026-11-16
        with:
          name: neural-office-v511-windows-test-host
          path: |
            desktop/src-tauri/target/release/neural-office-desktop.exe
            desktop/src-tauri/target/release/SHA256SUMS
            native-notices/**
          if-no-files-found: error
          retention-days: 14
