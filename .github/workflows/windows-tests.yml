name: Windows pilot tests
on:
  push:
    branches: [main, v5.2]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, resolved 2026-11-16
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, resolved 2026-11-16
        with:
          python-version: '3.12'
      - name: Test without models, credentials or private state
        run: python -B -m unittest discover -s tests -v
