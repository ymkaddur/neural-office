name: Windows pilot tests
on:
  push:
    branches: [main, v5.2, v5.2.1]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, resolved 2026-11-16
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0, resolved 2026-11-16
        with:
          python-version: '3.12'
      - name: Test without models, credentials or private state
        run: python -B -m unittest discover -s tests -v
