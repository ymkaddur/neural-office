name: Windows pilot tests
on:
  push:
    branches: [main, v5.2, v5.2.1, v5.3, feat/v5.10-windows-review, feat/v5.11-director, feat/v5.12-control, feat/v5.12-polished, feat/v5.13-polished]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, resolved 2026-11-16
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0, resolved 2026-11-16
        with:
          python-version: '3.12'
      - name: Install the pinned local readers
        run: 'python -m pip install --only-binary=:all: --require-hashes -r requirements-readers-windows.txt'
      - name: Verify the source inventory against canonical Git bytes
        run: python -B tools/publication_manifest.py
      - name: Test without models, credentials or private state
        run: python -B -m unittest discover -s tests -v
      - name: Verify the published V5.7 comparison without a model
        run: python -B tools/verify_v57.py
      - name: Reproduce corrected forensic boundaries with synthetic state
        run: python -B tests/repro_v541_boundaries.py --repo . --expect fixed
  desktop-preview:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, resolved 2026-11-16
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
  desktop-native:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Build the local desktop renderer
        working-directory: desktop
        run: |
          npm ci --ignore-scripts
          npm run build -- --mode native
      - name: Test the native command boundary
        working-directory: desktop/src-tauri
        run: cargo test --locked --features custom-protocol
      - name: Compile the Windows test host
        working-directory: desktop/src-tauri
        run: cargo build --locked --release --features custom-protocol
      - name: Hash the test executable
        shell: pwsh
        run: |
          $binary = 'desktop/src-tauri/target/release/neural-office-desktop.exe'
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $binary).Hash.ToLowerInvariant()
          "$hash  neural-office-desktop.exe" | Set-Content -Encoding ascii 'desktop/src-tauri/target/release/SHA256SUMS'
      - name: Collect notices for the compiled dependency set
        run: python -B tools/collect_native_notices.py --output native-notices
      - name: Prepare isolated native UI test tools
        id: native_tools
        shell: pwsh
        run: ./tests/Prepare-V55NativeCI.ps1 -UIAutomationOnly
      - name: Package the compiled host, Python core, launcher and notices outside the checkout
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = Join-Path $env:RUNNER_TEMP 'Neural-Office-Windows.zip'
          $pilot = Join-Path $env:RUNNER_TEMP 'Neural Office piloto'
          python -B tools/package_windows_pilot.py --exe desktop/src-tauri/target/release/neural-office-desktop.exe --notices native-notices --output $bundle
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Expand-Archive -LiteralPath $bundle -DestinationPath $pilot
          & (Join-Path $pilot 'Start-NeuralOffice-Desktop.ps1') -Check -Python (Get-Command python).Source -State (Join-Path $env:RUNNER_TEMP 'v535-check.sqlite3')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "NO_PILOT_DIR=$pilot" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Open the extracted pilot, attach two files and read the Director answers
        run: python -B tests/v535_windows_acceptance.py local
      - name: Test consent, keyboard, minimum window and one real model call after restart
        timeout-minutes: 17
        run: python -B tests/v535_windows_acceptance.py model
      - name: Verify the five real attachments, citations, ZIP image and reopening through Windows UI Automation
        if: ${{ !cancelled() && steps.native_tools.outcome == 'success' }}
        run: python -B -m tools.verify_v513_desktop --exe desktop/src-tauri/target/release/neural-office-desktop.exe --output v513-multiformat
      - name: Verify offline HTML, free review during delayed discovery and Stop during a retained report
        if: ${{ !cancelled() && steps.native_tools.outcome == 'success' }}
        run: python -B -m tools.verify_v512_desktop --exe desktop/src-tauri/target/release/neural-office-desktop.exe --output v513-controls
      - name: Exercise packaged UI, native picker, real model and restart
        if: ${{ !cancelled() && steps.native_tools.outcome == 'success' }}
        timeout-minutes: 15
        run: python -B tests/e2e_v55_native_uia.py --output native-e2e-evidence --profile-work
      - name: Upload synthetic native UI evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: neural-office-windows-acceptance
          path: |
            v535-package-evidence/
            native-e2e-evidence/
            v513-controls/
            v513-multiformat/
          if-no-files-found: warn
          retention-days: 14
