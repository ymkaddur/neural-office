name: V5.35-POLISHED native Windows acceptance
on:
  push:
    branches: [ci/v5.35-polished-windows]
permissions:
  contents: read
  actions: read
jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PRODUCT_SHA: 12f6c04c7fc3ce297d08a01826a82c873936380b
      PYTHONUTF8: 1
    steps:
      - name: Check out test harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: tests/v535_windows_acceptance.py
          sparse-checkout-cone-mode: false
      - name: Check out the published application at its exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.PRODUCT_SHA }}
          path: product
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Restore the exact executable from the successful two-file test while it is retained
        id: verified_binary
        if: github.repository == 'ymkaddur/neural-office'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $api = 'https://api.github.com/repos/ymkaddur/neural-office/actions/artifacts/14668301288'
          $headers = @{Authorization="Bearer $env:GH_TOKEN"; Accept='application/vnd.github+json'}
          $response = Invoke-WebRequest -Uri $api -Headers $headers -SkipHttpErrorCheck
          if ($response.StatusCode -eq 404 -or $response.StatusCode -eq 410) { Write-Host 'Previous artifact unavailable; building from source.'; exit 0 }
          if ($response.StatusCode -ne 200) { throw "Artifact lookup failed ($($response.StatusCode))" }
          $metadata = $response.Content | ConvertFrom-Json
          if ($metadata.expired) { Write-Host 'Previous artifact expired; building from source.'; exit 0 }
          $archiveHash = '11f6aef44114c87414b7f33047f5d039bd719b63643606436365bf87a0bb7d82'
          $exeHash = 'ecf418b1b9e2ab127007ade1fce4f53f3c99dffdded6ff72e03eed180736417d'
          if ($metadata.workflow_run.id -ne 44812217437 -or $metadata.digest -ne "sha256:$archiveHash") { throw 'Artifact provenance mismatch' }
          $archive = Join-Path $env:RUNNER_TEMP 'v535-pinned-binary.zip'
          Invoke-WebRequest -Uri "$api/zip" -Headers $headers -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive).Hash -ne $archiveHash) { throw 'Downloaded archive digest differs' }
          $restored = Join-Path $env:RUNNER_TEMP 'v535-pinned-binary'
          Expand-Archive -LiteralPath $archive -DestinationPath $restored
          $releaseDir = 'product/desktop/src-tauri/target/release'
          $exe = Get-Item -LiteralPath (Join-Path $restored "$releaseDir/neural-office-desktop.exe")
          if ($exe.VersionInfo.ProductVersion -ne '5.35.1' -or (Get-FileHash -LiteralPath $exe.FullName).Hash -ne $exeHash) { throw 'Executable identity differs' }
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null
          Copy-Item -LiteralPath $exe.FullName -Destination $releaseDir
          Copy-Item -LiteralPath (Join-Path $restored "$releaseDir/SHA256SUMS") -Destination $releaseDir
          Copy-Item -LiteralPath (Join-Path $restored 'binary-notices') -Destination 'binary-notices' -Recurse
          'restored=true' | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
      - name: Build the production Tauri executable
        if: steps.verified_binary.outputs.restored != 'true'
        working-directory: product/desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne $env:PRODUCT_SHA) { throw 'Wrong product checkout' }
          npm.cmd ci --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm.cmd run native:build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = Get-Item -LiteralPath 'src-tauri/target/release/neural-office-desktop.exe'
          if ($exe.VersionInfo.ProductVersion -ne '5.35.1') { throw 'Unexpected product version' }
          (Get-FileHash -LiteralPath $exe.FullName).Hash.ToLowerInvariant() + '  neural-office-desktop.exe' |
            Set-Content -Encoding ascii -LiteralPath 'src-tauri/target/release/SHA256SUMS'
      - name: Prepare Windows UI Automation and pinned readers
        working-directory: product
        shell: pwsh
        run: ./tests/Prepare-V55NativeCI.ps1 -UIAutomationOnly
      - name: Open the native window, attach both files and check two Director answers
        id: local_gui
        working-directory: product
        run: python -B ../tests/v535_windows_acceptance.py local
      - name: Authorize one real Ollama call and read its answer in the native window
        working-directory: product
        timeout-minutes: 17
        run: python -B ../tests/v535_windows_acceptance.py model
      - name: Upload native screenshots and acceptance receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: v535-polished-native-evidence
          path: evidence/
          if-no-files-found: warn
          retention-days: 14
      - name: Collect notices for the tested binary
        id: notices
        if: ${{ !cancelled() && steps.local_gui.outcome == 'success' && steps.verified_binary.outputs.restored != 'true' }}
        working-directory: product
        run: python -B tools/collect_native_notices.py --output ../binary-notices
      - name: Upload the tested executable and its hash
        if: ${{ !cancelled() && steps.local_gui.outcome == 'success' && (steps.notices.outcome == 'success' || steps.verified_binary.outputs.restored == 'true') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: v535-polished-windows-exe
          path: |
            product/desktop/src-tauri/target/release/neural-office-desktop.exe
            product/desktop/src-tauri/target/release/SHA256SUMS
            binary-notices/
          if-no-files-found: error
          retention-days: 14
