name: V5.35-POLISHED native Windows acceptance
on:
  push:
    branches: [ci/v5.35-polished-windows]
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PRODUCT_SHA: 12f6c04c7fc3ce297d08a01826a82c873936380b
      PYTHONUTF8: 1
    steps:
      - name: Check out test harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: tests/v535_windows_acceptance.py
          sparse-checkout-cone-mode: false
      - name: Check out the published application at its exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.PRODUCT_SHA }}
          path: product
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Build the production Tauri executable
        working-directory: product/desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne $env:PRODUCT_SHA) { throw 'Wrong product checkout' }
          npm.cmd ci --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm.cmd run native:build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = Get-Item -LiteralPath 'src-tauri/target/release/neural-office-desktop.exe'
          if ($exe.VersionInfo.ProductVersion -ne '5.35.1') { throw 'Unexpected product version' }
          (Get-FileHash -LiteralPath $exe.FullName).Hash.ToLowerInvariant() + '  neural-office-desktop.exe' |
            Set-Content -Encoding ascii -LiteralPath 'src-tauri/target/release/SHA256SUMS'
      - name: Prepare Windows UI Automation and pinned readers
        working-directory: product
        shell: pwsh
        run: ./tests/Prepare-V55NativeCI.ps1 -UIAutomationOnly
      - name: Open the native window, attach both files and check two Director answers
        id: local_gui
        working-directory: product
        run: python -B ../tests/v535_windows_acceptance.py local
      - name: Authorize one real Ollama call and read its answer in the native window
        working-directory: product
        timeout-minutes: 17
        run: python -B ../tests/v535_windows_acceptance.py model
      - name: Upload native screenshots and acceptance receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: v535-polished-native-evidence
          path: evidence/
          if-no-files-found: warn
          retention-days: 14
      - name: Collect notices for the tested binary
        id: notices
        if: ${{ !cancelled() && steps.local_gui.outcome == 'success' }}
        working-directory: product
        run: python -B tools/collect_native_notices.py --output ../binary-notices
      - name: Upload the tested executable and its hash
        if: ${{ !cancelled() && steps.notices.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: v535-polished-windows-exe
          path: |
            product/desktop/src-tauri/target/release/neural-office-desktop.exe
            product/desktop/src-tauri/target/release/SHA256SUMS
            binary-notices/
          if-no-files-found: error
          retention-days: 14
