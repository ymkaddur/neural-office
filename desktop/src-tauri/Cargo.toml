[package]
name = "neural-office-desktop"
version = "5.5.0"
edition = "2021"
license = "MIT"
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.5", features = [] }

[dependencies]
tauri = { version = "=2.12.6", features = [] }
serde_json = "1"
rfd = "=0.18.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
panic = "abort"
